# Stack PROD Torchons & Serviettes — Scaleway public.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Ne remplace PAS docker-compose.yml (dev local : Postgres seul + uvicorn
# venv). Ici : db + api (conteneur) + caddy (TLS auto). Volume pgdata
# DISTINCT du dev (ts_pgdata_prod) pour ne jamais ecraser la base locale.
#
# Pre-requis sur le serveur avant `up` :
#   - .env.prod rempli (cf. .env.prod.example) — JAMAIS commit
#   - backend/firebase-key.json present (scp depuis poste dev) — gitignored
#   - DNS api.torchonsetserviettes.app -> IP serveur (pour le TLS Caddy)
#
# Variante BETA : FAITE le 2026-08-17, voir `docker-compose.beta.yml`. Elle
# tourne sur <beta-host> et non sur cette VM, donc sans Caddy ni TLS — le tailnet
# chiffre deja, et un certificat exigerait un DNS public. Le vhost beta-api.*
# commente dans le Caddyfile ne sert donc que si la beta revient un jour sur
# Scaleway.

services:
  db:
    image: postgres:16-alpine
    container_name: ts_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    # Bind localhost-only : permet pg_dump/pg_restore depuis le serveur
    # pendant le cutover, sans exposer Postgres a l'exterieur.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ts_pgdata_prod:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    # En CI, TS_API_IMAGE = ref registry Scaleway (rg.fr-par.scw.cloud/.../ts-api:<sha>)
    # -> `docker compose pull api` recupere l'image construite par le workflow.
    # En local / serveur sans CI : fallback build local (`up -d --build`).
    image: ${TS_API_IMAGE:-ts-api:latest}
    container_name: ts_api_prod
    restart: unless-stopped
    # uvicorn is PID 1 and never reaps children it did not spawn (a killed
    # healthcheck leaves one). A minimal init as PID 1 reaps them all.
    init: true
    env_file:
      - .env.prod
    environment:
      # Override : dans le reseau compose, la DB est joignable via `db:5432`.
      # (Ces valeurs priment sur celles du .env.prod si differentes.)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Commit d'ou vient le code, expose par /api/health. DECLARATIF : il dit
      # d'ou le code est cense venir. Ce qui prouve ce qui TOURNE est
      # `code_fingerprint`, calcule sur les fichiers servis (cf.
      # backend/app/utils/code_fingerprint.py). Vide hors CI, sans consequence.
      GIT_SHA: ${GIT_SHA:-}
      # uvicorn takes the client IP from X-Forwarded-For only if the sender is
      # trusted (default 127.0.0.1). Behind Caddy every request would come from
      # Caddy's container, and the per-IP rate limit (app/utils/rate_limit.py)
      # would count all clients as one. "*" is safe HERE only: the API is
      # `expose`d, not published, so Caddy is the only sender; and Caddy, with
      # no `trusted_proxies`, replaces any X-Forwarded-For a client sends.
      FORWARDED_ALLOW_IPS: "*"
      # No /docs, /redoc, /openapi.json in production (app/config.py).
      EXPOSE_API_DOCS: "false"
    volumes:
      # Cle Firebase fournie au runtime (gitignored, scp manuel sur serveur).
      - ./backend/firebase-key.json:/app/firebase-key.json:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8002"

  caddy:
    image: caddy:2-alpine
    container_name: ts_caddy_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  ts_pgdata_prod:
  caddy_data:
  caddy_config:

# Module registry — progressive disclosure (P1, see docs/module-registry.fr.md).
#
# Single source of truth for the two-level feature registry: the core (never
# disabled, not listed here) plus 8 modules, each with its sub-options.
# Consumed by the settings screen, the contextual proposals, and — from P5 on —
# the public site cards.
#
# Multi-locale: label fields (title / pitch / details / example) are
# {locale: string} dicts, resolved by `pick_locale`, same convention as
# catalog.yaml.
#
# Field reference
#   key            stable slug, used as module_states.module_key. Never rename.
#   scope          collective | personal. Derived from nature: collective as
#                  soon as ONE sub-option changes the shared model.
#   default_new    state for a foyer created after the switchover. Existing
#                  foyers are grandfathered to true by the backfill migration.
#   order          display order in the settings screen.
#   requires       module keys that must be enabled first.
#   trigger.kind   signal (a real event fires it) | usage (a threshold does)
#                  | none (no proposal, on from day one).
#   trigger.key    identifier the proposal generator dispatches on. Thresholds
#                  for `usage` triggers are deliberately unset — no data exists
#                  yet to calibrate them, see docs/module-registry.md § Usage
#                  thresholds.
#   sub_options[].state_field
#                  where the sub-option state already lives today. Absent means
#                  the sub-option has no independent state (it follows its
#                  module). Prevents P2 from inventing storage that exists.
#
# site_cards lives at the end of this file (added in P5).

modules:
  - key: repartition
    scope: collective
    default_new: false
    order: 1
    title:
      fr: "Répartition"
      en: "Sharing"
    pitch:
      fr: "Qui fait quoi, et une charge qui peut être équitable sans être égale."
      en: "Who does what, and a load that can be fair without being equal."
    details:
      fr: >-
        Attribue les tâches, tient compte de ce que chacun préfère faire, pondère
        par la pénibilité, et suit la part de chacun sur les 30 derniers jours.
      en: >-
        Assigns tasks, accounts for what each person prefers doing, weights by
        effort, and tracks each member's share over the last 30 days.
    example:
      fr: >-
        J'aime arroser les plantes, mon colocataire déteste ça. L'app me les propose
        en priorité, et lui en suggère d'autres : chacun fait ce qu'il préfère.
      en: >-
        I like watering the plants, my flatmate hates it. The app offers them to me
        first and suggests other tasks to them: everyone does what they prefer.
    guide:
      why:
        fr: >-
          Pour ne plus avoir à se demander qui fait quoi. Torchons & Serviettes
          propose à chacun les tâches en retard et, parmi elles, celles qu'il aime
          faire. Et quand on a l'impression d'en faire plus que l'autre, l'app répond
          par des faits : la part réelle de chacun, comparée à une part visée
          équitable, pas forcément égale.
        en: >-
          So you no longer have to work out who does what. Torchons & Serviettes
          offers everyone the overdue tasks and, among them, the ones they enjoy.
          And when you feel you do more than the other, the app answers with facts:
          each person's real share, compared with a fair target share, not
          necessarily an equal one.
      how:
        fr: >-
          Notez les tâches que vous aimez ou détestez, et réglez leur pénibilité et
          leur fréquence. De temps en temps, l'app vous présente une tâche à évaluer :
          répondez au mieux, c'est ce qui affine les suggestions. Si vous passez, elle
          vous en demandera moins souvent.
        en: >-
          Rate the tasks you like or dislike, and set their effort and frequency.
          Now and then the app shows you a task to rate: answer as best you can, it
          is what sharpens the suggestions. If you skip, it will ask you less often.
    trigger:
      kind: signal
      key: second_member_joined
    sub_options:
      - key: assignment
        scope: collective
        title: { fr: "Attribution", en: "Assignment" }
      - key: affinity
        scope: collective
        title: { fr: "Préférences", en: "Preferences" }
      - key: affinity_popup
        scope: personal
        state_field: user_settings.affinity_popup_enabled
        title: { fr: "Me demander de noter", en: "Ask me to rate" }
      - key: effort
        scope: collective
        title: { fr: "Pénibilité", en: "Effort" }
      - key: fair_share
        scope: collective
        title: { fr: "Part équitable", en: "Fair share" }

  - key: motivation
    scope: collective
    default_new: false
    order: 2
    title:
      fr: "Motivation"
      en: "Motivation"
    pitch:
      fr: "Des points, des badges et une série à ne pas casser — si ça vous parle."
      en: "Points, badges and a streak worth keeping — if that speaks to you."
    details:
      fr: >-
        Chaque tâche terminée rapporte des points selon sa pénibilité. Les badges
        marquent les paliers, la série compte les jours consécutifs, le classement
        situe chacun dans le foyer.
      en: >-
        Each completed task earns points based on its effort. Badges mark
        milestones, the streak counts consecutive days, the leaderboard places
        everyone within the foyer.
    example:
      fr: >-
        Vider le lave-vaisselle prend cinq minutes et personne ne le remarque.
        Validé chaque matin, il rapporte environ 150 points dans le mois. Et partir
        trois jours ne casse pas votre série, si l'absence est posée.
      en: >-
        Emptying the dishwasher takes five minutes and nobody notices. Completed
        every morning, it earns about 150 points in a month. And three days away do
        not break your streak, as long as the absence is recorded.
    guide:
      why:
        fr: >-
          Une tâche faite ne laisse aucune trace si vous êtes seul à l'avoir vue. Les
          validations, les points et les séries gardent la mémoire de l'effort de
          chacun. Quand on a l'impression d'en faire plus que l'autre, on peut
          s'appuyer sur des faits plutôt que sur des impressions.
        en: >-
          A finished task leaves no trace if you are the only one who saw it.
          Completions, points and streaks keep a record of everyone's effort. When
          you feel you do more than the other, you can rely on facts rather than
          impressions.
      how:
        fr: >-
          Validez au moment où vous faites la tâche, même les petites : c'est là que
          la série se construit. Le classement sert à se situer, pas à se comparer.
          Qui préfère ne pas le voir peut le masquer pour lui seul avec « Ne pas me
          les afficher ».
        en: >-
          Complete a task as you do it, even the small ones: that is how the streak
          builds up. The leaderboard is there to see where you stand, not to compete.
          Anyone who would rather not see it can hide it just for themselves with
          "Do not show them to me".
    trigger:
      kind: usage
      key: completions_reached
    sub_options:
      - key: points
        scope: collective
        title: { fr: "Points", en: "Points" }
      - key: badges
        scope: collective
        title: { fr: "Badges", en: "Badges" }
      - key: streaks
        scope: collective
        title: { fr: "Séries", en: "Streaks" }
      - key: leaderboard
        scope: collective
        title: { fr: "Classement", en: "Leaderboard" }
      # Personal display preference. This is the requalified
      # user_settings.gamification_enabled: NOT a second gate on a collective
      # decision (that was the defect), but an explicitly labelled personal
      # choice under a module the foyer has enabled.
      - key: hide_for_me
        scope: personal
        state_field: user_settings.gamification_enabled
        title: { fr: "Ne pas me les afficher", en: "Do not show them to me" }

  - key: bonus_malus
    scope: collective
    default_new: false
    order: 3
    requires: [motivation]
    title:
      fr: "Bonus et malus"
      en: "Bonus and penalty"
    pitch:
      fr: "Fait en retard, ça rapporte plus. Refait trop tôt, ça rapporte moins."
      en: "Done late, worth more. Redone too soon, worth less."
    details:
      fr: >-
        Ajuste les points selon l'écart à l'échéance : un bonus quand une tâche est
        faite en retard, un malus quand elle est refaite trop tôt, avec des seuils
        propres à chaque tolérance.
      en: >-
        Adjusts points by the gap to the due date: a bonus when a task is done
        late, a penalty when it is redone too soon, with thresholds of its own for
        each tolerance.
    example:
      fr: >-
        Les draps se changent chaque semaine. En Normal, changés avec deux jours de
        retard, ils rapportent 50 % de points en plus ; en Strict, un jour suffit.
        Le frigo, prévu tous les 30 jours, nettoyé au bout de 10 jours seulement
        rapporte environ un quart de points en moins.
      en: >-
        The sheets get changed every week. On Normal, changed two days late, they
        earn 50% more points; on Strict, one day is enough. The fridge, due every
        30 days, cleaned after only 10 days earns about a quarter fewer points.
    guide:
      why:
        fr: >-
          Une tâche qui prend du retard est souvent une tâche que personne ne veut
          faire : la récompenser davantage donne envie de s'y mettre. À l'inverse,
          refaire trop tôt une tâche encore fraîche rapporte moins : les points vont
          à ce qui en a vraiment besoin.
        en: >-
          A task that falls behind is often one nobody wants to do: rewarding it
          more makes someone want to take it on. The other way round, redoing a
          task too soon earns less: the points go where they are really needed.
      how:
        fr: >-
          Réglez au mieux la tolérance de chaque tâche (Strict, Normal ou Souple) et
          sa fréquence : l'app se débrouille du reste. En Strict, le bonus et le
          malus arrivent dès un petit écart ; en Souple, il en faut davantage.
        en: >-
          Set each task's tolerance (Strict, Normal or Loose) and its frequency as
          well as you can: the app takes care of the rest. On Strict, the bonus and
          the penalty kick in at a small gap; on Loose, it takes more.
    trigger:
      kind: usage
      key: after_motivation
    sub_options:
      - key: late_bonus
        scope: collective
        title: { fr: "Bonus de retard", en: "Late bonus" }
      - key: early_malus
        scope: collective
        title: { fr: "Malus d'avance", en: "Early penalty" }

  - key: objectives
    scope: collective
    default_new: false
    order: 4
    title:
      fr: "Objectifs et rattrapage"
      en: "Goals and catching up"
    pitch:
      fr: "Combien de minutes par jour pour revenir à zéro, et en combien de temps."
      en: "How many minutes a day to get back to zero, and how long it takes."
    details:
      fr: >-
        Chiffre le retard accumulé, le rythme réel des 14 derniers jours, et le
        rythme nécessaire pour le tenir. Chacun peut se fixer un objectif, ou en
        proposer un au foyer.
      en: >-
        Quantifies the accumulated backlog, the real pace over the last 14 days,
        and the pace needed to hold it. Anyone can set a personal goal, or
        propose one to the foyer.
    example:
      fr: >-
        Le foyer a 3 heures de retard, et le quotidien demande 30 minutes par jour.
        À 20 minutes chacun, le retard disparaît en 18 jours ; à 30 minutes chacun,
        en 6 jours.
      en: >-
        The foyer is 3 hours behind, and day-to-day upkeep takes 30 minutes a day.
        At 20 minutes each, the backlog is gone in 18 days; at 30 minutes each, in
        6 days.
    guide:
      why:
        fr: >-
          Le retard accumulé décourage : on ne sait plus par où reprendre. Le module
          le ramène à un chiffre simple : combien de minutes par jour pour rattraper
          ce retard, et en combien de jours.
        en: >-
          A growing backlog is discouraging: you no longer know where to start. The
          module boils it down to one simple number: how many minutes a day to catch
          up, and in how many days.
      how:
        fr: >-
          Posez-vous ensemble, avec les membres du foyer, et décidez combien de temps
          par jour vous accordez aux tâches. Touchez la carte « Moi » de l'accueil, ou
          « Simuler le rattrapage du foyer » dans l'écran Foyer : la simulation
          montre, pour chaque réglage, en combien de jours le retard
          disparaît. Puis « Proposer au foyer » : chacun accepte sur son téléphone dans
          les trois minutes, et l'objectif vous engage tous. Mieux vaut 15 minutes
          tenues qu'une heure abandonnée.
        en: >-
          Sit down together with the members of the foyer and decide how much time a
          day you give to the tasks. Tap the "Me" card on the home screen, or
          "Simulate household catch-up" in the Foyer screen: the simulation
          shows, for each setting, how many days it takes to clear the
          backlog. Then "Propose to household": everyone accepts on their phone within
          three minutes, and the goal commits you all. 15 minutes kept beat an hour
          given up.
    trigger:
      kind: signal
      key: backlog_threshold_reached
    sub_options:
      - key: catchup_cockpit
        scope: collective
        title: { fr: "Cockpit de rattrapage", en: "Catch-up cockpit" }
      - key: simulation
        scope: collective
        title: { fr: "Simulation", en: "Simulation" }
      - key: member_propositions
        scope: collective
        title: { fr: "Propositions au foyer", en: "Proposals to the foyer" }
      - key: personal_objective
        scope: personal
        state_field: user_foyers.daily_objective_minutes
        title: { fr: "Mon objectif", en: "My goal" }

  - key: presence
    scope: collective
    default_new: false
    order: 5
    title:
      fr: "Absences et présence"
      en: "Absences and presence"
    pitch:
      fr: "Personne à la maison ? Les tâches qui attendent votre retour se mettent en pause."
      en: "Nobody home? The tasks that wait for your return pause on their own."
    details:
      fr: >-
        Repère les jours où le foyer est absent et met en pause les tâches à faire
        sur place, sauf celles dont le besoin continue sans vous. Rien à rattraper
        au retour.
      en: >-
        Spots the days the foyer is away and pauses the tasks that must be done on
        site, except those whose need keeps growing without you. Nothing to catch
        up on when you get back.
    example:
      fr: >-
        Partis du vendredi au dimanche, vous marquez les trois jours en rouge. Les
        draps et la poussière reprennent là où vous les aviez laissés ; la pelouse,
        elle, a poussé et reste en retard.
      en: >-
        Away from Friday to Sunday, you mark the three days in red. The sheets and
        the dusting pick up where you left them; the lawn, though, kept growing and
        stays overdue.
    guide:
      why:
        fr: >-
          Un week-end dehors ne doit pas laisser une liste rouge au retour. Personne
          ne change les draps d'une maison vide : ces tâches attendent votre retour
          au lieu de prendre du retard.
        en: >-
          A weekend away should not leave a red list waiting for you. Nobody changes
          the sheets of an empty home: those tasks wait for your return instead of
          falling behind.
      how:
        fr: >-
          Trois gestes, une fois pour toutes. Renseignez le WiFi de la maison dans
          l'écran Foyer : chaque ouverture de l'app sur ce WiFi marque la journée
          « présent ». Répondez à la question de présence quand elle apparaît : vert
          pour les jours où vous étiez là, rouge pour ceux où vous étiez partis. Tant
          qu'un jour reste sans réponse, il compte comme une absence. Enfin, dans les
          contextes, indiquez ce qui exige d'être sur place, et ce qui continue sans
          vous.
        en: >-
          Three steps, once and for all. Enter the home WiFi in the Foyer screen:
          each time the app opens on that WiFi, the day is marked "present". Answer
          the presence question when it shows up: green for the days you were there,
          red for the days you were away. As long as a day stays unanswered, it
          counts as an absence. Finally, in the contexts, say what requires being on
          site, and what keeps going without you.
    trigger:
      kind: signal
      key: absence_detected
    sub_options:
      - key: home_freeze
        scope: collective
        state_field: foyers.home_freeze_enabled
        title: { fr: "Gel pendant les absences", en: "Freeze while away" }
      - key: category_freeze
        scope: collective
        title: { fr: "Contextes concernés", en: "Affected contexts" }
      - key: home_wifi
        scope: personal
        state_field: user_settings.hide_home_tasks_off_wifi
        title: { fr: "Masquer hors du WiFi maison", en: "Hide off home WiFi" }

  - key: auto_adjust
    scope: collective
    default_new: false
    order: 6
    title:
      fr: "Ajustement automatique"
      en: "Automatic adjustment"
    pitch:
      fr: "Une tâche toujours en retard ? L'app propose de revoir son réglage."
      en: "A task always late? The app offers to revisit its settings."
    details:
      fr: >-
        Repère les tâches systématiquement faites en retard et propose d'augmenter
        leur pénibilité. Chaque membre peut aussi demander aux autres de revoter
        la pénibilité ou la fréquence d'une tâche.
      en: >-
        Spots tasks that are chronically done late and offers to raise their
        effort. Any member can also ask the others to re-vote a task's effort or
        frequency.
    example:
      fr: >-
        « Nettoyer le four » est faite en retard presque à chaque fois : l'app
        propose d'augmenter sa pénibilité, pour qu'elle rapporte ce qu'elle coûte
        vraiment. Vous trouvez qu'une fois par mois, c'est trop souvent : depuis la
        fiche de la tâche, vous demandez à votre colocataire de revoter sa
        fréquence.
      en: >-
        "Clean the oven" is done late almost every time: the app offers to raise
        its effort, so it earns what it really costs. You think once a month is
        too often: from the task's page, you ask your flatmate to re-vote its
        frequency.
    guide:
      why:
        fr: >-
          Une tâche toujours en retard est souvent une tâche mal réglée : trop
          fréquente, ou plus pénible qu'annoncé. Plutôt que de culpabiliser, l'app
          propose de revoir son réglage.
        en: >-
          A task that is always late is often a badly tuned one: too frequent, or
          harder than stated. Rather than feeling guilty, the app offers to revisit
          its settings.
      how:
        fr: >-
          Quand une proposition arrive, répondez-y franchement : augmenter la
          pénibilité ou espacer la fréquence est une bonne réponse, pas un aveu.
          Si vous n'êtes pas d'accord entre vous, demandez l'avis des autres
          membres par un vote.
        en: >-
          When a suggestion comes in, answer it honestly: raising the effort or
          spacing out the frequency is a good answer, not an admission. If you
          disagree among yourselves, ask the other members to weigh in with a vote.
    trigger:
      kind: signal
      key: task_chronically_late
    sub_options:
      - key: bump_effort
        scope: collective
        title: { fr: "Ajuster la pénibilité", en: "Adjust effort" }
      - key: frequency_vote
        scope: collective
        title: { fr: "Revoter la fréquence", en: "Re-vote frequency" }

  - key: statistics
    scope: personal
    default_new: false
    order: 7
    title:
      fr: "Statistiques et historique"
      en: "Statistics and history"
    pitch:
      fr: "Ce que vous avez fait, en courbes, et le détail de chaque tâche."
      en: "What you have done, as charts, plus the detail of every task."
    details:
      fr: >-
        Courbes d'activité, répartition par contexte, et l'historique enrichi de
        chaque tâche — modifications, votes, qui a changé quoi et quand.
      en: >-
        Activity charts, breakdown by context, and the enriched history of each
        task — edits, votes, who changed what and when.
    example:
      fr: >-
        Vous ouvrez l'historique de « Détartrer la bouilloire » : elle n'a pas été
        faite depuis quatre mois, et votre colocataire a espacé sa fréquence en
        mars. Plus besoin de chercher qui a changé quoi.
      en: >-
        You open the history of "Descale the kettle": it has not been done for four
        months, and your flatmate spaced out its frequency in March. No more
        guessing who changed what.
    guide:
      why:
        fr: >-
          Au bout de quelques semaines, l'historique dit des choses qu'on ne voit pas
          au jour le jour : les semaines chargées, les tâches oubliées, ce qui a
          changé depuis le début.
        en: >-
          After a few weeks, the history shows things you do not notice day to day:
          the busy weeks, the forgotten tasks, what has changed since the start.
      how:
        fr: >-
          Jetez un œil aux courbes de temps en temps plutôt que chaque jour. Ouvrez
          l'historique d'une tâche pour savoir qui l'a modifiée et quand, ou pour
          retrouver la date de sa dernière réalisation.
        en: >-
          Glance at the charts now and then rather than every day. Open a task's
          history to see who changed it and when, or to find the last time it was
          done.
    trigger:
      kind: usage
      key: history_volume_reached
    sub_options:
      - key: charts
        scope: personal
        title: { fr: "Courbes", en: "Charts" }
      - key: enriched_history
        scope: personal
        title: { fr: "Historique détaillé", en: "Detailed history" }

  - key: reminders
    scope: personal
    default_new: true
    order: 8
    title:
      fr: "Rappels"
      en: "Reminders"
    pitch:
      fr: "Un rappel quand quelque chose presse — et rien d'autre."
      en: "A reminder when something is pressing — and nothing else."
    details:
      fr: >-
        Un récapitulatif à l'heure de votre choix, une alerte quand une tâche passe
        au rouge, et si vous le voulez un signal quand quelqu'un d'autre en termine
        une.
      en: >-
        A digest at the hour of your choosing, an alert when a task turns red, and
        if you want it a ping when someone else completes one.
    guide:
      why:
        fr: >-
          L'app ne sert que si on y pense. Les rappels vous préviennent au bon
          moment, sans vous inonder de notifications.
        en: >-
          The app only helps if you remember it. Reminders tell you at the right
          moment, without flooding you with notifications.
      how:
        fr: >-
          Choisissez l'heure du récapitulatif quotidien selon votre rythme, gardez
          l'alerte des tâches urgentes, et n'activez les complétions des autres que
          si vous voulez suivre ce qui se fait. Chaque réglage est personnel : il ne
          change rien pour les autres membres.
        en: >-
          Pick the hour of the daily digest to fit your routine, keep the urgent
          task alert, and only turn on others' completions if you want to follow
          what gets done. Every setting is personal: it changes nothing for the
          other members.
    trigger:
      kind: none
    sub_options:
      - key: daily
        scope: personal
        state_field: user_settings.notif_daily
        title: { fr: "Récapitulatif quotidien", en: "Daily digest" }
      - key: urgent
        scope: personal
        state_field: user_settings.notif_urgent
        title: { fr: "Tâches urgentes", en: "Urgent tasks" }
      - key: solo
        scope: personal
        state_field: user_settings.notif_solo
        title: { fr: "Complétions des autres", en: "Others' completions" }
      - key: collective_with_me
        scope: personal
        state_field: user_settings.notif_collective_with_me
        title: { fr: "Collectives avec moi", en: "Collective, including me" }
      - key: collective_without_me
        scope: personal
        state_field: user_settings.notif_collective_without_me
        title: { fr: "Collectives sans moi", en: "Collective, without me" }
      - key: hour
        scope: personal
        state_field: user_settings.notif_hour
        title: { fr: "Heure du récapitulatif", en: "Digest hour" }

# --- Cartes du site public (P5) ---
#
# Le site ne montre PAS les modules un a un. Il montre des BENEFICES, et chaque
# carte declare le ou les modules derriere elle. Aligner 1:1 aurait echange
# trois cartes concretes ("L'un prefere l'aspirateur, l'autre la vaisselle")
# contre un nom de categorie, et mis "Bonus / malus" et ses 13 seuils en
# vitrine — l'inverse de ce qu'on veut montrer en premier.
#
# `modules` est informatif : il dit ce que la carte recouvre, il ne pilote pas
# l'affichage. Une carte avec `[]` decrit une propriete de l'app (le noyau,
# le hors-ligne, le principe de decouverte), pas une fonctionnalite activable.
#
# Plafond assume : 10 cartes. Un 9e module n'obtient pas sa carte
# automatiquement — c'est un arbitrage editorial a refaire a chaque fois.
# Modules sans carte aujourd'hui : bonus_malus, auto_adjust, statistics,
# reminders. Ils restent visibles dans le depliant des cartes qui les portent.
#
# `detail` alimente le depliant au clic (<details> natif, aucun JS ajoute).
# Genere dans site/index.html et site/en/index.html par
# `scripts/gen_site_content.py`, entre les marqueurs CARDS:START / CARDS:END.

site_cards:
  - key: recurring
    modules: []
    icon: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'
    title:
      fr: "Tâches récurrentes"
      en: "Recurring tasks"
    blurb:
      fr: "Des tâches qui reviennent (tous les X jours, plus souvent l'été, à date fixe…) réparties dans le foyer."
      en: "Tasks that come back (every X days, more often in summer, on a fixed date…) shared across the household."
    detail:
      fr: >-
        Cinq modèles : « Régulière », tous les X jours ; « Selon le mois »,
        une fréquence différente selon le mois, pour ce qui suit les saisons ;
        « À date fixe » sur le calendrier, sans dérive possible même si vous la
        faites en retard ; « Anniversaire de la 1re fois », qui revient à la
        date anniversaire de la première exécution ; ou « Irrégulière », quand
        il y a besoin — l'app apprend alors la cadence réelle. Les tâches sans
        récurrence existent aussi (« Une seule fois ») : une fois faites,
        elles s'archivent seules.
      en: >-
        Five patterns: "Regular", every X days; "Varies by month", a different
        frequency per month, for whatever follows the seasons; "On a fixed
        date" on the calendar, with no drift even if you do it late;
        "Anniversary of the first time", which comes back on the anniversary
        of the first completion; or "Irregular", whenever it is needed — the
        app then learns the real cadence. One-shot tasks exist too ("Once
        only"): once done, they archive themselves.

  - key: urgency
    modules: []
    icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
    title:
      fr: "Urgence en un coup d'œil"
      en: "Urgency at a glance"
    blurb:
      fr: "Vert / orange / rouge : voyez immédiatement ce qui presse et ce qui peut attendre."
      en: "Green / amber / red: see at once what is pressing and what can wait."
    detail:
      fr: >-
        La couleur vient d'une date d'échéance calculée, pas d'une impression :
        dernière fois faite + intervalle. L'orange s'allume proportionnellement
        à la fréquence — trois jours avant pour une tâche mensuelle, la veille
        pour une tâche hebdomadaire.
      en: >-
        The colour comes from a computed due date rather than a feeling: last
        done plus interval. Amber lights up in proportion to the frequency —
        three days ahead for a monthly task, the day before for a weekly one.

  - key: fair_share
    modules: [repartition]
    icon: '<path d="M12 3v18"/><path d="M3 7h18"/><path d="M7 7l-3 6h6z"/><path d="M17 7l3 6h-6z"/>'
    title:
      fr: "Part équitable"
      en: "Fair share"
    blurb:
      fr: "Un ratio configurable par membre : la charge peut être équitable, pas seulement égale."
      en: "A ratio you set per member: the load can be fair, not merely equal."
    detail:
      fr: >-
        Tout le monde ne peut pas en faire autant, et 50/50 n'est pas toujours
        juste. Vous fixez le ratio visé, l'app suit l'écart réel sur les 30
        derniers jours — une fenêtre glissante, donc un mauvais mois ne vous
        poursuit pas.
      en: >-
        Not everyone can do as much, and 50/50 is not always fair. You set the
        target ratio, the app tracks the real gap over the last 30 days — a
        rolling window, so a bad month does not follow you around.

  - key: preferences
    modules: [repartition]
    icon: '<path d="M20.8 5.6a5 5 0 0 0-7-.2l-.8.8-.8-.8a5 5 0 0 0-7 7l8 8 8-8a5 5 0 0 0-.4-6.6z"/>'
    title:
      fr: "Préférences de chacun"
      en: "Everyone's preferences"
    blurb:
      fr: "L'un préfère l'aspirateur, l'autre la vaisselle : l'app en tient compte dans la répartition."
      en: "One prefers vacuuming, the other the dishes: the app takes that into account."
    detail:
      fr: >-
        Chacun note ce qu'il aime faire et ce qu'il évite. Quand l'app suggère
        la prochaine tâche, elle propose en priorité à celui que ça dérange le
        moins — sans jamais dispenser personne.
      en: >-
        Each person rates what they like doing and what they avoid. When the app
        suggests the next task, it offers it first to whoever minds least —
        without ever letting anyone off the hook.

  - key: effort
    modules: [repartition]
    icon: '<path d="M12 14a8 8 0 0 1 8-8"/><path d="M4 14a8 8 0 0 1 4-7"/><path d="M12 14l4-4"/><path d="M3 19h18"/>'
    title:
      fr: "Pénibilité"
      en: "Effort"
    blurb:
      fr: "Chaque tâche a un « effort » : 5 min de vaisselle ≠ un grand ménage, et le calcul le sait."
      en: "Every task carries an effort: 5 minutes of dishes is not a deep clean, and the maths knows it."
    detail:
      fr: >-
        L'effort est voté par les membres, pas décrété par l'app : c'est vous
        qui savez ce que coûte de nettoyer votre four. Il pondère la part
        équitable — dix tâches faciles ne valent pas une corvée.
      en: >-
        Effort is voted on by the members, not decreed by the app: you are the
        one who knows what cleaning your oven costs. It weights the fair share —
        ten easy tasks do not equal one slog.

  - key: absences
    modules: [presence]
    icon: '<path d="M2 20h20"/><path d="M5 20l3-9 9-3 2 5-9 3z"/><path d="M14 8l3-3 3 3-3 3"/>'
    title:
      fr: "Gestion des absences"
      en: "Handling absences"
    blurb:
      fr: "Tout le monde part 15 jours ? L'app ne vous demande pas de passer l'aspirateur en rentrant."
      en: "Everyone away for two weeks? The app will not ask you to vacuum on the way back in."
    detail:
      fr: >-
        Les jours où le foyer est vide ne comptent pas pour les tâches qui
        exigent d'être sur place. La détection est automatique via le WiFi
        maison, et vous pouvez toujours corriger un jour à la main.
      en: >-
        Days when the household is empty do not count against tasks that require
        being there. Detection is automatic via home WiFi, and you can always
        correct a day by hand.

  - key: catching_up
    modules: [objectives]
    icon: '<path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/><path d="M3 21h18"/>'
    title:
      fr: "Rattraper le retard"
      en: "Catching up"
    blurb:
      fr: "Combien de minutes par jour pour revenir à zéro, et en combien de temps."
      en: "How many minutes a day to get back to zero, and how long it will take."
    detail:
      fr: >-
        Le retard accumulé devient un chiffre, pas une angoisse. L'app compare
        votre rythme réel des deux dernières semaines au rythme nécessaire, et
        vous laisse simuler : « et si je faisais 20 minutes par jour ? »
      en: >-
        The backlog becomes a number rather than a worry. The app compares your
        real pace over the last fortnight with the pace needed, and lets you
        simulate: what if I did 20 minutes a day?

  - key: motivation
    modules: [motivation]
    icon: '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>'
    title:
      fr: "Motivation, si vous voulez"
      en: "Motivation, if you want it"
    blurb:
      fr: "Points, badges et séries — ou rien du tout. C'est un choix, pas une fatalité."
      en: "Points, badges and streaks — or none of it. A choice, not a fixture."
    detail:
      fr: >-
        Un foyer sur deux n'en veut pas, et c'est très bien : la gamification
        s'éteint d'un interrupteur, pour le foyer entier ou pour vous seul. Rien
        n'est perdu si vous l'allumez plus tard — les points comptés en silence
        apparaissent d'un coup.
      en: >-
        Half of households want none of it, and that is fine: gamification turns
        off with one switch, for the whole household or for you alone. Nothing
        is lost if you turn it on later — the points counted quietly show up all
        at once.

  - key: grows_with_you
    modules: []
    icon: '<path d="M12 21V9"/><path d="M12 12C12 8 9 5 5 5c0 4 3 7 7 7z"/><path d="M12 14c0-3.3 2.7-6 6-6 0 3.3-2.7 6-6 6z"/><path d="M5 21h14"/>'
    title:
      fr: "L'app grandit avec vous"
      en: "The app grows with you"
    blurb:
      fr: "À l'installation : des tâches et des couleurs. Le reste arrive quand ça vous sert."
      en: "On install: tasks and colours. The rest turns up when it becomes useful."
    detail:
      fr: >-
        Tout ce qui est décrit ici n'apparaît pas le premier jour. L'app le
        propose quand un événement le justifie — quelqu'un rejoint le foyer,
        vous rentrez de quinze jours d'absence, une tâche dérape toujours. Une
        proposition par semaine au maximum, et jamais deux fois si vous avez dit
        non.
      en: >-
        None of what is described here shows up on day one. The app offers it
        when something makes it relevant — someone joins the household, you come
        back from a fortnight away, one task keeps drifting. One proposal a week
        at most, and never twice if you said no.

  - key: offline
    modules: []
    icon: '<path d="M3 3l18 18"/><path d="M6.7 6.7A6 6 0 0 0 6 18h11"/><path d="M16 7a5 5 0 0 1 3 8"/>'
    title:
      fr: "Hors-ligne"
      en: "Offline"
    blurb:
      fr: "Fonctionne sans réseau et se synchronise toute seule dès que la connexion revient."
      en: "Works with no network and syncs on its own as soon as the connection returns."
    detail:
      fr: >-
        Tout est lisible et modifiable sans réseau : la cave, le métro, la
        maison de campagne. Les changements partent en file d'attente et se
        réconcilient au retour du réseau, sans écraser ce que l'autre a fait
        pendant ce temps.
      en: >-
        Everything stays readable and editable with no network: the cellar, the
        underground, the house in the country. Changes queue up and reconcile
        when the network returns, without overwriting what the other person did
        meanwhile.

# Catalogue de templates pour Torchons & Serviettes (v0.9.0 Feature 4).
#
# Ce fichier est la source de verite curatee pour les suggestions de
# pieces / categories / taches. Les users peuvent importer des items de
# ce catalogue en 1 clic via l'ecran CatalogScreen pour peupler leur foyer
# plus vite qu'en creant tout a la main.
#
# Identifiants stables : chaque item a un `key` slug unique, independant
# du display name (permet la traduction future + le tracking de popularite
# via tasks.template_key / rooms.template_key / categories.template_key).
#
# Multi-locale : les champs title/name/description sont des dicts
# {locale: string}. Pour v0.9.0 on ne remplit que 'fr'. Le backend
# choisira la locale de l'user plus tard (aujourd'hui fallback fr).


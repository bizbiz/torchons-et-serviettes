# Catalogue de templates — CONTEXTES (chantier contextes).
#
# Remplace les anciennes sections `rooms` et `categories`. Un contexte est ce
# qui EXPLIQUE qu'une tache existe : une piece, un animal, un exterieur, une
# situation de vie, ou un genre de travail. Une tache en declare PLUSIEURS —
# « Nettoyer la litière » releve du chat, du salon et du logement — la ou elle
# portait avant exactement une piece et exactement une categorie.
#
# ORDRE SIGNIFICATIF : le premier contexte est le principal. Il decide sous
# quelle section la tache s'affiche dans le wizard, ce qui evite qu'une tache a
# trois contextes apparaisse trois fois. A l'affichage, on retient le premier
# que l'utilisateur a SELECTIONNE : une tache listant [chat, chien] doit
# s'afficher sous Chien chez qui n'a qu'un chien.
#
# RESOLUTION DES DRAPEAUX : OU logique sur tous les contextes de la tache, la
# direction prudente dans les deux cas.
#   requires_presence  un seul l'exige -> la tache l'exige. Mieux vaut masquer
#                      a tort une tache faisable a distance que d'en proposer
#                      une qu'on ne peut pas faire d'ici.
#   accrues_when_away  un seul l'accumule -> elle s'accumule. Geler a tort rend
#                      la dette invisible ; ne pas geler a tort coute une tache
#                      rouge qu'on solde en trente secondes.
#
# selectable=false : contexte implicite que tout foyer a (menage, linge,
# entretien, courses). Jamais propose a l'etape 3 — « faites-vous du menage ? »
# n'a pas de sens — mais porte le filtre « montre-moi tout le menage », qui
# etait le role de l'ancienne categorie.
#
# GENERE depuis le document de relecture v3 par scripts/v3_to_catalog.py. Le
# markdown reste la source editoriale : corriger la-bas, puis regenerer.
#
# The `en` labels live HERE, not in the (French-only) markdown: regenerating
# keeps them, matched by key, and seeds a new entry with its French label.
# tests/test_catalog_translations.py fails on any label left untranslated.


    name:
      fr: "Menage"
    color: "#10B981"
    requires_home: true

  - key: cuisine_cat
    name:
      fr: "Cuisine"
    color: "#F59E0B"
    requires_home: true

  - key: linge
    name:
      fr: "Linge"
    color: "#6366F1"
    requires_home: true

  - key: courses
    name:
      fr: "Courses"
    color: "#EC4899"
    requires_home: false

  - key: administratif
    name:

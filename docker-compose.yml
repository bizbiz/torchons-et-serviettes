services:
  db:
    image: postgres:16-alpine
    container_name: ts_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED***}
      POSTGRES_DB: ${POSTGRES_DB:-torchons_serviettes}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ts_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsapp} -d ${POSTGRES_DB:-torchons_serviettes}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ts_pgdata:

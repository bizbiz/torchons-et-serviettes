name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # CI-only dummy values: this database is created for the run and thrown away.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/ci
      DATABASE_URL_SYNC: postgresql://ci:ci-only-password@localhost:5432/ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install "pytest>=8.0" "pytest-asyncio>=0.24"
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest

  android:
    name: Android JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Use the example Firebase config
        run: cp app/google-services.example.json app/google-services.json
      - name: Run JVM unit tests
        run: bash ./gradlew --no-daemon testBetaReleaseUnitTest

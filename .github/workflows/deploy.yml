# SQUELETTE CI deploiement prod — Scaleway Container Registry + SSH.
#
# Etat : manuel (workflow_dispatch) tant que les secrets ne sont pas cables.
# Activer le push auto sur tag une fois le flow valide en dry-run.
#
# Secrets GitHub a creer (Settings > Secrets and variables > Actions) :
#   SCW_REGISTRY      ex: rg.fr-par.scw.cloud/torchons-serviettes
#   SCW_SECRET_KEY    cle secrete Scaleway (user = "nologin")
#   DEPLOY_SSH_HOST   IP / host de l'instance Scaleway
#   DEPLOY_SSH_USER   ex: root  (ou user docker)
#   DEPLOY_SSH_KEY    cle privee SSH (PEM) autorisee sur le serveur
#   DEPLOY_PATH       ex: /path/to/clone (repo clone cote serveur)
#
# Pre-requis serveur : repo clone dans DEPLOY_PATH, .env.prod rempli,
# backend/firebase-key.json present, docker + compose v2 installes,
# `docker login` Scaleway deja fait OU fait par le step deploy.

name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper "deploy" pour confirmer le deploiement prod'
        required: true
        default: ''

jobs:
  build-and-push:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image=${{ secrets.SCW_REGISTRY }}/ts-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login Scaleway registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ secrets.SCW_REGISTRY }}" -u nologin --password-stdin

      - name: Build & push image
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" -t "${{ secrets.SCW_REGISTRY }}/ts-api:latest" ./backend
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ secrets.SCW_REGISTRY }}/ts-api:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull + up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            echo "${{ secrets.SCW_SECRET_KEY }}" | docker login "${{ secrets.SCW_REGISTRY }}" -u nologin --password-stdin
            export TS_API_IMAGE="${{ needs.build-and-push.outputs.image }}"
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            # Smoke test : echoue le job si /api/health n'est pas ok.
            sleep 8
            curl -fsS https://api.torchonsetserviettes.app/api/health | grep -q '"status":"ok"'

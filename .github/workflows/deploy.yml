# Production backend deployment — build on the server via SSH.
#
# The image is built ON the server (docker compose up -d --build): no
# registry, no build-and-push job. A previous registry-based path was
# removed (empty TS_API_IMAGE bug -> compose pulled the ts-api:latest
# fallback).
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_HOST   server IP or hostname
#   DEPLOY_SSH_USER   SSH user authorized on the server
#   DEPLOY_SSH_KEY    private SSH key authorized on the server
#   DEPLOY_PATH       repo clone on the server (e.g. /path/to/clone)
#
# Server prerequisites (already provisioned):
#   - repo cloned in DEPLOY_PATH, owned by DEPLOY_SSH_USER
#   - DEPLOY_SSH_USER in the docker group
#   - read-only deploy key for git pull + github.com in known_hosts
#   - .env.prod filled in, backend/firebase-key.json present
#
# Trigger:
#   gh workflow run deploy.yml -f confirm=deploy
#   then: gh run watch
# (or UI: Actions > deploy-prod > Run workflow > confirm field = "deploy")

name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper "deploy" pour confirmer le deploiement prod'
        required: true
        default: ''

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull + build + up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build api
            # Smoke test : le conteneur enchaine les migrations Alembic PUIS
            # uvicorn au boot, donc le cold-start peut depasser 10s. On sonde
            # /api/health en boucle (max ~60s) au lieu d'un sleep fixe qui
            # produisait de faux echecs (502 transitoire pendant le boot).
            ok=""
            for i in $(seq 1 20); do
              if curl -fsS https://api.torchonsetserviettes.app/api/health \
                   | grep -q '"status":"ok"'; then
                ok=1
                echo "[smoke] health ok after ${i} attempt(s)"
                break
              fi
              echo "[smoke] not ready yet (attempt ${i}/20), retrying in 3s..."
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "[smoke] health check failed after ~60s"
              exit 1
            fi

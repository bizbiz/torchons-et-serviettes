# Deploiement backend prod (Scaleway) — build serveur via SSH.
#
# Build SUR le serveur (docker compose up -d --build) : pas de registry,
# pas de job build-and-push. C'est la voie qui a deploye 0.32.0 puis la
# refonte offline-first ecran detail (mai 2026) ; fiable pour ce backend
# dogfood 2 personnes. L'ancien chemin registry est retire (bug
# TS_API_IMAGE vide -> compose tirait le fallback ts-api:latest).
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   DEPLOY_SSH_HOST   IP de l'instance Scaleway (***REMOVED***)
#   DEPLOY_SSH_USER   user SSH (ubuntu)
#   DEPLOY_SSH_KEY    cle privee SSH autorisee sur le serveur
#   DEPLOY_PATH       repo clone cote serveur (/path/to/clone)
# (SCW_REGISTRY / SCW_SECRET_KEY ne sont PLUS utilises — peuvent rester.)
#
# Pre-requis serveur (faits — cf docs/runbook-deploy-scaleway.md) :
#   - repo clone dans DEPLOY_PATH, POSSEDE par DEPLOY_SSH_USER
#   - DEPLOY_SSH_USER dans le groupe docker
#   - deploy key read-only du user pour git pull + github.com en known_hosts
#   - .env.prod rempli, backend/firebase-key.json present
#
# Declenchement (autonome) :
#   gh workflow run deploy.yml -f confirm=deploy -R bizbiz/torchons-serviettes
#   puis : gh run watch
# (ou UI : Actions > deploy-prod > Run workflow > champ confirm = "deploy")

name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper "deploy" pour confirmer le deploiement prod'
        required: true
        default: ''

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull + build + up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build api
            # Smoke test : echoue le job si /api/health n'est pas ok.
            sleep 8
            curl -fsS https://api.torchonsetserviettes.app/api/health | grep -q '"status":"ok"'
